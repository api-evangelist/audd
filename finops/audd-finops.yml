meters:
- name: recognition_requests
  description: Music recognition API calls billed per 1,000 requests after the free allotment.
  unit: requests
  aggregation: sum
  dimensions:
  - account
  - method
- name: enterprise_chunks
  description: Enterprise file-scan usage, counted as one request per 12 seconds of audio scanned.
  unit: requests
  aggregation: sum
  dimensions:
  - account
- name: stream_months
  description: Audio stream monitoring billed per stream per month.
  unit: streams
  aggregation: sum
  dimensions:
  - account
  - database
principles:
- name: Visibility
  description: Track request counts per method (recognize, recognizeWithOffset, findLyrics) and per stream in the AudD dashboard.
- name: Allocation
  description: Separate API tokens per workload/team to map recognition spend to internal cost centers.
- name: Optimization
  description: Use enterprise skip/every/limit controls to scan fewer chunks; commit to monthly tiers for lower per-1,000 rates at volume.
- name: Accountability
  description: Assign owners per token; review monthly request and stream spend against budget.
