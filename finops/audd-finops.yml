description: >-
  FinOps view of AudD spend. AudD bills usage-based per-request rates for music
  recognition (including recognizeWithOffset, humming, and lyrics methods),
  per-stream-per-month rates for audio stream monitoring, and chunk-based
  billing on the enterprise file-scan endpoint (one request per 12 seconds of
  audio). A 300-request free allotment precedes billing.
notes: >-
  Per-1,000 and per-stream rates are subject to change and volume discounts;
  verify against the AudD pricing/contact pages during reconciliation.
