description: AudD is a music recognition service that identifies songs from audio
  files, URLs, or microphone input via a simple REST API. The api.audd.io API returns
  rich track metadata (artist, title, album, ISRC, links to Apple Music, Spotify,
  Deezer and more), supports recognition by humming/singing, lyrics search, and an
  enterprise endpoint for scanning long audio and video files.
