  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://docs.audd.io/
  baseURL: https://api.audd.io
  properties:
  - url: https://docs.audd.io/
    type: Documentation
  - url: openapi/audd-openapi.yml
    type: OpenAPI
  - url: collections/audd.postman_collection.json
    type: PostmanCollection
  - url: collections/audd.opencollection.json
    type: OpenCollection
  description: Searches for song lyrics by title, artist, or an excerpt of the lyrics
    via the findLyrics method, returning matching songs with full lyrics and metadata.
