name: AudD
kind: company
description: AudD is a music recognition service. Its REST API identifies songs from
  short audio clips, uploaded files or URLs on api.audd.io, scans audio and video files
  of any length on the enterprise endpoint (enterprise.audd.io), monitors live audio
  streams with results delivered by callback or longpoll, and adds an account's own
  tracks to a custom catalog (special access). Matches return track metadata (artist,
  title, album, ISRC) with optional Apple Music, Spotify, Deezer and MusicBrainz data.
