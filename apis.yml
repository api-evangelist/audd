x-correction-request:
  requested: '2026-10-07'
  source:
  - _messages/2026-10/2026-10-07-fastmail-38767-corrections-for-the-audd-profile-githubcomapi-evan.md
  request: 'AudD API Team (api@audd.io), 2026-10-07: (1) the OpenAPI in the repo is not theirs -- use https://audd.io/openapi.json
    (OpenAPI 3.1, also in https://audd.io/.well-known/api-catalog); (2) humming/singing recognition is legacy and unsupported -- exclude
    it; (3) lyrics search is not a supported feature -- remove the Lyrics API and lyrics tags; (4) results no longer include Napster;
    (5) errors, including rate-limit errors, are HTTP 200 with "status": "error" and an error code, never 429; (6) the enterprise
    endpoint and the streams API are documented and in the spec; (7) recognition requests modify nothing and should not be labelled write.'
  applied: '2026-10-08'
  applied_note: 'Verified live 2026-10-08: https://audd.io/openapi.json 200 (OpenAPI 3.1.0, info.version 1.4.4, 11 operations: recognize
    GET/POST, recognizeEnterprise on enterprise.audd.io, 7 streams operations, customCatalogAdd); api-catalog 200 application/linkset+json
    naming it as service-desc; docs.audd.io/streams/ and /upload_audio_endpoint/ 200; ErrorResponse is status const "error" + error_code.
    Removed the pipeline-written 3.0.1 _original (it invented recognizeWithOffset, findLyrics and humming) and its Lyrics/Recognition
    splits; archived the provider''s spec verbatim and re-split into Recognition, Streams and Custom Catalog APIs; regenerated the Postman
    and Open Collection files from the new splits and removed the lyrics and combined ones. Lyrics tag and humming/lyrics plan, finops
    and review text removed; Napster dropped from the description and README (note: the provider''s own spec still defines a NapsterMetadata
    schema, "may be absent"). Rate limits now record HTTP 200 + status error, no 429. Agentic access re-derived from the new spec and
    recognize/recognizeEnterprise curated to read (method: searched). api-catalog harvested into well-known/ and pointed to.'
