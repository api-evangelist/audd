description: >-
  AudD gates access primarily through request quotas rather than fine-grained
  per-second rate limits. Without an api_token, usage is capped at 10 requests
  per method per day. With a token, the 300-request free allotment and any
  monthly plan limits apply; additional usage is billed per 1,000 requests.
  The enterprise endpoint counts one request per 12 seconds of audio scanned.
  Specific per-second throttling values are not documented publicly.
notes: >-
  Confirm any per-second or concurrency limits with AudD support during
  reconciliation; the public documentation describes daily/monthly request
  quotas rather than burst rate limits.
