responseCodes:
  throttled: 200
  throttledBody: 'HTTP 200 with a JSON body {"status": "error", "error": {"error_code": ..., "error_message": ...}}; AudD does not return HTTP 429'
limits:
- name: Anonymous Requests Per Day
  scope: ip
  metric: requests
  limit: 10 per method per day (no api_token)
  notes: Free anonymous usage without an API token.
- name: Free Token Allotment
  scope: account
  metric: requests
  limit: 300 free requests
  notes: Included free with a new account before billing begins.
- name: Monthly Plan Quota
  scope: account
  metric: requests
  limit: per purchased plan (e.g. 100K / 200K / 500K per month)
  notes: Usage beyond the plan is billed per 1,000 requests.
- name: Enterprise Chunk Billing
  scope: account
  metric: requests
  limit: 1 request per 12 seconds of audio scanned
  notes: Applies to the enterprise file-scan endpoint.
policies:
- name: Quota-Based Access
  description: Access is controlled by free allotment and purchased monthly request quotas rather than per-second throttling.
- name: Backoff Strategy
  description: >-
    Errors, including rate-limit and quota errors, arrive as HTTP 200 with "status": "error" and a numeric error_code (AudD, 2026-10-07; ErrorResponse in https://audd.io/openapi.json). Check status on every response; back off on a limit error code rather than waiting for a 429, which AudD does not send.
